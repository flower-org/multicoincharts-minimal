name: Minify MultiCoinCharts
description: >
  Minifies the MultiCoinCharts static site (npm run build) into dist/.
  Builds the copy of the site that contains this action, so it can be used as
  `uses: ./.github/actions/minify` in this repo, via the same path inside a submodule checkout, or as
  `uses: flower-org/multicoincharts-minimal/.github/actions/minify@<ref>` from other repositories.
  !!! WARNING !!! Requires Node.js on PATH: callers must run actions/setup-node first. It is deliberately not nested
  here, because any nested action with a post step makes the runner re-read this action.yml at job end, which fails
  if the caller has deleted the site sources by then (as callers typically do, to package only the minified site
  without build files like this action.yml).

outputs:
  dist-path:
    description: Absolute path to the built dist/ directory.
    value: ${{ steps.site.outputs.root }}/dist

runs:
  using: composite
  steps:
    # This action lives in <site root>/.github/actions/minify
    - name: Locate site root
      id: site
      shell: bash
      run: |
        root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        # Git Bash on Windows yields /d/a/... paths; convert to native form for working-directory and callers
        if [ "$RUNNER_OS" = "Windows" ]; then root="$(cygpath -w "$root")"; fi
        echo "root=$root" >> "$GITHUB_OUTPUT"

    - name: Install dependencies and build
      shell: bash
      working-directory: ${{ steps.site.outputs.root }}
      run: |
        npm ci --no-audit --no-fund
        npm run build
